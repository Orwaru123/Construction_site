
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Construction Site Attendance</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Construction Site Attendance</h1>
    <p>Worker check-in, check-out and engineer dashboard</p>
  </header>

  <main class="login-container">
    <div class="card">
      <div class="tabs">
        <button id="adminTab" class="active"
          onclick="choose('admin')">Engineer Login</button>
        <button id="workerTab"
          onclick="choose('worker')">Worker Login</button>
      </div>

      <section id="adminLogin">
        <h2>Engineer Login</h2>

        <label for="adminUser">Username</label>
        <input id="adminUser" autocomplete="username"
          placeholder="Enter admin username">

        <label for="adminPass">Password</label>
        <input id="adminPass" type="password"
          autocomplete="current-password"
          placeholder="Enter admin password">

        <button class="primary full" onclick="adminLogin()">
          Sign in
        </button>
      </section>

      <section id="workerLogin" class="hidden">
        <h2>Worker Login</h2>

        <label for="workerId">Worker ID</label>
        <input id="workerId" maxlength="8" inputmode="numeric"
          placeholder="Enter your 8-digit Worker ID">

        <label for="workerPin">PIN</label>
        <input id="workerPin" type="password" maxlength="6"
          inputmode="numeric" placeholder="Enter your PIN">

        <button class="primary full" onclick="workerLogin()">
          Continue to Attendance
        </button>
      </section>

      <p id="message"></p>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
