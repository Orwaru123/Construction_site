<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172B4D">
  <title>Admin Login | Construction Site Attendance</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body class="login-page">
  <header class="header">
    <h1>Construction Site Attendance</h1>
    <p>Construction workforce management system</p>
  </header>

  <main class="login-container">
    <section class="panel login-panel">
      <div class="login-icon" aria-hidden="true">🏗️</div>
      <h2>Admin Login</h2>
      <p>Sign in to manage workers and site attendance.</p>

      <div id="message" class="message" hidden role="status"></div>

      <form id="loginForm">
        <label for="username">Admin Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Enter admin username"
          autocomplete="username"
          required
        >

        <label for="password">Admin Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Enter admin password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Sign In</button>
      </form>

      <p class="login-note">Authorised administrators only.</p>
    </section>
  </main>

  <footer class="footer">
    <p>Construction Site Attendance System</p>
  </footer>
</body>
</html>
